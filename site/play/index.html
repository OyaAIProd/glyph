<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glyph Playground</title>
  <meta name="description" content="Paste a CSV, edit a spec, see the chart + audit findings + trust score." />
  <meta property="og:title" content="Glyph Playground" />
  <meta property="og:description" content="Paste a CSV, edit a spec, see the chart + audit findings + trust score." />
  <meta property="og:url" content="https://seanhanca.github.io/glyph/play/" />
  <!-- og:image landed alongside the launch PR (PR6). 1200x630 PNG at
       site/og-playground.png. If the image file isn't yet rendered, the
       URL 404s gracefully and the rest of the OG card still works. -->
  <meta property="og:image" content="../og-playground.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Glyph Playground" />
  <meta name="twitter:description" content="Paste a CSV, edit a spec, see the chart + audit findings + trust score." />
  <meta name="twitter:image" content="../og-playground.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="../" class="brand">Glyph</a>
    <nav>
      <!-- No `category=` — the maintainer needs to create the "Playground" -->
      <!-- category in repo Settings → Discussions → Categories first. Without -->
      <!-- it, the param 404s. Template alone routes the user to the form. -->
      <a href="https://github.com/seanhanca/glyph/discussions/new?template=playground.yml" target="_blank" rel="noopener">Submit to gallery</a>
      <a href="https://github.com/seanhanca/glyph">GitHub</a>
      <a href="../">Docs</a>
    </nav>
  </header>

  <main class="playground" id="playground">
    <section class="pane pane-data">
      <h2>Data</h2>
      <div id="csv-upload"></div>
    </section>
    <section class="pane pane-spec">
      <h2>Spec</h2>
      <div id="spec-editor"></div>
    </section>
    <section class="pane pane-chart">
      <h2>Chart</h2>
      <!-- Filled by playground.js (PR4): live SVG from compileSpec+renderSvg
           against the user's CSV. Empty until a dataset loads. -->
      <div id="chart-preview"></div>
    </section>
    <aside class="pane pane-audit">
      <h2>Audit <span class="trust" id="trust" aria-live="polite" aria-label="Trust score"></span></h2>
      <!-- aria-live so screen-reader users hear new findings as they type. -->
      <ul id="audit-findings" aria-live="polite" aria-label="Audit findings">
        <li class="placeholder">Audit panel lands in PR5.</li>
      </ul>
    </aside>
  </main>

  <div class="actions">
    <button id="share-url">Share URL</button>
    <button id="share-gist">Save to Gist</button>
  </div>

  <script type="module" src="./playground.js"></script>
</body>
</html>
