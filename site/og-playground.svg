<!--
  Source for the OG card. Render to PNG with any of:
    rsvg-convert -w 1200 -h 630 site/og-playground.svg -o site/og-playground.png
    magick -density 150 site/og-playground.svg -resize 1200x630 site/og-playground.png
    inkscape site/og-playground.svg --export-type=png --export-filename=site/og-playground.png -w 1200 -h 630
  Then commit the PNG. The HTML references ../og-playground.png from /play/.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f4fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Wordmark -->
  <g transform="translate(80, 80)" font-family="system-ui, -apple-system, sans-serif">
    <!-- bar icon -->
    <g fill="#4c78a8">
      <rect x="0" y="34" width="14" height="22"/>
      <rect x="20" y="20" width="14" height="36"/>
      <rect x="40" y="6" width="14" height="50"/>
    </g>
    <text x="72" y="48" font-size="36" font-weight="700" fill="#1a1a1a">Glyph</text>
    <text x="72" y="78" font-size="18" fill="#4a4a4a">Playground</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 240)" font-family="system-ui, -apple-system, sans-serif">
    <text font-size="56" font-weight="700" fill="#1a1a1a">
      <tspan x="0" dy="0">Paste a CSV.</tspan>
      <tspan x="0" dy="68">Edit a spec.</tspan>
      <tspan x="0" dy="68" fill="#4c78a8">See the audit live.</tspan>
    </text>
  </g>

  <!-- Sample chart, lower right -->
  <g transform="translate(720, 200)">
    <rect x="0" y="0" width="400" height="280" rx="10" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
    <text x="200" y="26" font-family="system-ui" font-size="13" fill="#666" text-anchor="middle">rides by hour</text>
    <g stroke="#eee">
      <line x1="50" y1="60" x2="380" y2="60"/>
      <line x1="50" y1="110" x2="380" y2="110"/>
      <line x1="50" y1="160" x2="380" y2="160"/>
      <line x1="50" y1="210" x2="380" y2="210"/>
    </g>
    <g fill="#4c78a8">
      <rect x="62" y="190" width="22" height="40"/>
      <rect x="92" y="160" width="22" height="70"/>
      <rect x="122" y="130" width="22" height="100"/>
      <rect x="152" y="90"  width="22" height="140"/>
      <rect x="182" y="70"  width="22" height="160"/>
      <rect x="212" y="55"  width="22" height="175"/>
      <rect x="242" y="75"  width="22" height="155"/>
      <rect x="272" y="100" width="22" height="130"/>
      <rect x="302" y="135" width="22" height="95"/>
      <rect x="332" y="170" width="22" height="60"/>
    </g>
    <line x1="50" y1="230" x2="380" y2="230" stroke="#999"/>
    <line x1="50" y1="40"  x2="50"  y2="230" stroke="#999"/>
    <!-- trust chip -->
    <g transform="translate(310, 248)" font-family="ui-monospace, SF Mono, monospace">
      <rect x="0" y="0" width="76" height="22" rx="4" fill="#eaf6ee"/>
      <text x="38" y="15" font-size="11" font-weight="700" fill="#1f7a39" text-anchor="middle">92 / 100</text>
    </g>
  </g>

  <!-- URL footer -->
  <text x="80" y="570" font-family="ui-monospace, SF Mono, monospace" font-size="20" fill="#4a4a4a">
    seanhanca.github.io/glyph/play/
  </text>
  <!-- License/no-telemetry footer -->
  <text x="80" y="595" font-family="system-ui" font-size="14" fill="#7a7a7a">
    Apache 2.0  ·  no telemetry  ·  share via URL or GitHub Gist
  </text>
</svg>
