name: publish-python

# Fires on `python-v*` tag push (NOT `v*` — keeps a clean separation from any
# future TypeScript-side semver tags). Publishes `glyph-charts` to PyPI via
# OIDC trusted publishing, so no API token sits in repo secrets. The trusted
# publisher must be registered once on PyPI by a maintainer — see
# bindings/python/RELEASING.md for the one-time setup.
on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # `id-token: write` is what PyPI's OIDC flow consumes — without it the
    # `gh-action-pypi-publish` step has nothing to exchange for an upload
    # token. `contents: read` is the default-deny-friendly minimum for
    # `actions/checkout`.
    permissions:
      contents: read
      id-token: write
    # Gating the job behind a `release` environment lets maintainers add
    # protection rules (required reviewers, tag patterns) on the PyPI side
    # without touching this YAML. Mirrors publish-mcp.yml.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        # `pypa/build` is the PEP 517 frontend — it spins up an isolated env
        # per backend invocation so the wheel/sdist are reproducible across
        # contributor machines. Pinning hatchling here would be redundant;
        # pyproject.toml's `requires` already does that.
        run: python -m pip install --upgrade pip build

      - name: Build wheel + sdist
        working-directory: bindings/python
        run: python -m build

      - name: Smoke-test the wheel in a fresh venv
        # Catch broken wheels BEFORE they hit PyPI — a published bad wheel
        # cannot be replaced (PyPI prohibits filename reuse), so the only
        # remedy is yanking + bumping. Installing into a brand-new venv
        # (no `-e`, no source tree on sys.path) is the only way to verify
        # the wheel is self-sufficient.
        working-directory: bindings/python
        run: |
          python -m venv /tmp/glyph-smoke
          /tmp/glyph-smoke/bin/pip install --upgrade pip
          /tmp/glyph-smoke/bin/pip install dist/*.whl
          /tmp/glyph-smoke/bin/python -c "import glyph; print('glyph', glyph.__version__)"

      - name: Publish to PyPI
        # No `password:` — OIDC trusted publishing exchanges the workflow's
        # id-token for a short-lived upload credential. The action defaults
        # to `dist/`, so we point it at the bindings dir.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist

      - name: Summary
        run: |
          v=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('bindings/python/pyproject.toml').read_text())['project']['version'])")
          echo "## Published to PyPI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- glyph-charts @ $v — https://pypi.org/project/glyph-charts/$v/" >> $GITHUB_STEP_SUMMARY
