[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "glyph-charts"
version = "0.1.0a1"
description = "Deterministic chart compiler with 49 agent-callable verbs. Python bindings."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Glyph contributors" }]
keywords = ["charts", "visualization", "mcp", "agents", "duckdb", "svg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
jupyter = ["ipython>=8.0"]
all = ["pandas>=2.0", "ipython>=8.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas>=2.0",
    "ipython>=8.0",
]

[project.urls]
Homepage = "https://github.com/seanhanca/glyph"
Documentation = "https://github.com/seanhanca/glyph#readme"
Repository = "https://github.com/seanhanca/glyph"
Issues = "https://github.com/seanhanca/glyph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/glyph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

# Pandas is an optional extra — users of `glyph.pandas` install
# pandas-stubs themselves if they want column-typed access. Both the
# legacy missing-imports error AND mypy 1.x's `import-untyped` ("no
# stubs available") class are silenced here so `mypy src` stays clean
# without forcing pandas-stubs into the dev deps. The two import sites
# also have `# type: ignore[import-untyped]` markers — belt-and-braces
# since `disable_error_code` placement in module overrides has varied
# across mypy minor versions.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
